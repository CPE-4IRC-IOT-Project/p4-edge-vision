## Managed-component dependencies for ESP32-P4-EYE camera + pedestrian detection
dependencies:
  ## Board Support Package — handles I2C, power, XCLK, MIPI-CSI init
  esp32_p4_eye:
    version: "*"
    git: https://github.com/espressif/esp-bsp.git
    path: bsp/esp32_p4_eye

  ## V4L2 video capture over MIPI-CSI
  espressif/esp_video:
    version: "*"

  ## Deep-learning inference engine
  espressif/esp-dl:
    version: ">=3.0.0"

  ## Pre-trained pedestrian detection model
  espressif/pedestrian_detect:
    version: "*"
